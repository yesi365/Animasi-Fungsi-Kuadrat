<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misi Pedagang: Untung Maksimal dengan Fungsi Kuadrat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
        }

        body {
            background: #0b1a2f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #video-container {
            width: 1280px;
            height: 720px;
            background: #1a2f4e;
            border-radius: 32px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.8), 0 0 0 2px #ffb347;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        #scene-canvas {
            flex: 1;
            display: block;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, #f9e7b3, #d4a373);
        }

        .overlay-ui {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 40px 80px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
            background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
            color: white;
        }

        .dialog-box {
            background: rgba(10, 20, 30, 0.9);
            backdrop-filter: blur(6px);
            padding: 18px 28px;
            border-radius: 40px;
            border-left: 8px solid #ffb347;
            max-width: 70%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            pointer-events: auto;
        }

        .speaker {
            font-weight: 800;
            color: #ffb347;
            letter-spacing: 0.5px;
            font-size: 1.1rem;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .dialog-text {
            font-size: 1.25rem;
            line-height: 1.5;
            font-weight: 400;
            text-shadow: 1px 1px 3px black;
            min-height: 3.5em;
        }

        .narator-badge {
            background: #3a6ea5;
            color: white;
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: 600;
            letter-spacing: 1px;
            font-size: 1rem;
            border: 2px solid #aad0ff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            pointer-events: auto;
            white-space: nowrap;
        }

        .math-panel {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 20px 30px;
            border-radius: 24px;
            border: 2px solid #ffb347;
            color: #fff;
            font-size: 1.2rem;
            font-weight: 600;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            font-family: 'Courier New', monospace;
            line-height: 1.7;
            max-width: 400px;
        }

        .math-panel.show {
            opacity: 1;
        }

        .math-panel .highlight {
            color: #ffd966;
            font-size: 1.6rem;
        }

        .scene-indicator {
            position: absolute;
            top: 20px;
            left: 30px;
            background: rgba(0,0,0,0.6);
            padding: 8px 20px;
            border-radius: 30px;
            color: #ffe6b3;
            font-weight: 500;
            letter-spacing: 1px;
            border: 1px solid #ffb347;
            font-size: 0.9rem;
            z-index: 10;
        }

        .controls {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            pointer-events: auto;
            z-index: 20;
        }

        .controls button {
            background: #ffb347;
            border: none;
            border-radius: 40px;
            padding: 12px 22px;
            font-weight: 700;
            font-size: 0.95rem;
            color: #0b1a2f;
            cursor: pointer;
            box-shadow: 0 5px 0 #b46f1a;
            transition: all 0.1s;
            letter-spacing: 0.5px;
        }

        .controls button:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #b46f1a;
        }

        .controls button:disabled {
            opacity: 0.4;
            transform: translateY(4px);
            box-shadow: 0 1px 0 #b46f1a;
            cursor: not-allowed;
        }

        .voice-toggle {
            position: absolute;
            top: 20px;
            right: 30px;
            background: rgba(0,0,0,0.6);
            border: 1px solid #ffb347;
            color: #ffe6b3;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.85rem;
            z-index: 15;
            pointer-events: auto;
        }

        .voice-toggle.active {
            background: #ffb347;
            color: #0b1a2f;
            font-weight: 700;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .talking {
            animation: pulse 0.4s infinite;
        }
    </style>
</head>
<body>
<div id="video-container">
    <canvas id="scene-canvas" width="1280" height="720"></canvas>
    <div class="scene-indicator" id="sceneLabel">SCENE 1: PAGI YANG PENUH HARAPAN</div>
    <div class="math-panel" id="mathPanel"></div>
    <button class="voice-toggle active" id="voiceToggle">🔊 SUARA: AKTIF</button>
    <div class="overlay-ui">
        <div class="dialog-box" id="dialogBox">
            <div class="speaker" id="speakerName">PAK BUDI</div>
            <div class="dialog-text" id="dialogText">Wah, pagi ini buah-buahku segar semua! Mudah-mudahan dagangan laris dan untungnya makin besar!</div>
        </div>
        <div class="narator-badge" id="naratorBadge">👨‍🌾 PAK BUDI</div>
    </div>
    <div class="controls">
        <button id="prevBtn" disabled>◀ SEBELUMNYA</button>
        <button id="nextBtn">SELANJUTNYA ▶</button>
        <button id="playBtn">▶ PUTAR OTOMATIS</button>
    </div>
</div>

<script>
    (function(){
        const canvas = document.getElementById('scene-canvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        const sceneLabel = document.getElementById('sceneLabel');
        const speakerName = document.getElementById('speakerName');
        const dialogText = document.getElementById('dialogText');
        const naratorBadge = document.getElementById('naratorBadge');
        const mathPanel = document.getElementById('mathPanel');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const playBtn = document.getElementById('playBtn');
        const voiceToggle = document.getElementById('voiceToggle');

        // ========== AUDIO / SUARA ==========
        let voiceEnabled = true;
        let currentUtterance = null;
        let indonesianVoice = null;

        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            // Prioritas: id-ID
            indonesianVoice = voices.find(v => v.lang === 'id-ID' || v.lang === 'id_ID');
            if (!indonesianVoice) {
                indonesianVoice = voices.find(v => v.lang.startsWith('id'));
            }
            if (!indonesianVoice && voices.length > 0) {
                indonesianVoice = voices[0]; // fallback
            }
        }

        if (window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            loadVoices();
        }

        // Efek suara sederhana pakai Web Audio API (pasar, koin)
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }

        function playTone(freq, duration, type = 'sine', volume = 0.08) {
            if (!voiceEnabled) return;
            try {
                const ac = getAudioContext();
                const osc = ac.createOscillator();
                const gain = ac.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.value = volume;
                osc.connect(gain);
                gain.connect(ac.destination);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + duration);
                osc.stop(ac.currentTime + duration);
            } catch(e) {}
        }

        function playCoinSound() {
            playTone(1200, 0.1, 'square', 0.06);
            setTimeout(() => playTone(1600, 0.15, 'square', 0.05), 80);
        }

        function playMarketAmbience() {
            // Suara latar pasar sederhana: nada rendah berosilasi
            playTone(220, 0.3, 'sine', 0.03);
            setTimeout(() => playTone(260, 0.25, 'sine', 0.025), 150);
            setTimeout(() => playTone(200, 0.2, 'sine', 0.02), 300);
        }

        function speak(text, speaker) {
            if (!voiceEnabled) return;
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel(); // hentikan suara sebelumnya

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';
            utterance.rate = 0.95;
            utterance.pitch = speaker === 'PAK BUDI' ? 1.15 : 1.0;
            utterance.volume = 1;
            if (indonesianVoice) utterance.voice = indonesianVoice;
            utterance.onstart = () => {
                if (speaker === 'PAK BUDI') {
                    dialogBox.classList.add('talking');
                }
            };
            utterance.onend = () => {
                dialogBox.classList.remove('talking');
            };
            currentUtterance = utterance;
            window.speechSynthesis.speak(utterance);
        }

        voiceToggle.addEventListener('click', () => {
            voiceEnabled = !voiceEnabled;
            if (voiceEnabled) {
                voiceToggle.textContent = '🔊 SUARA: AKTIF';
                voiceToggle.classList.add('active');
                // ulangi dialog scene sekarang
                const scene = scenes[currentScene];
                speak(scene.text, scene.speaker);
                playMarketAmbience();
            } else {
                voiceToggle.textContent = '🔇 SUARA: MATI';
                voiceToggle.classList.remove('active');
                window.speechSynthesis.cancel();
                dialogBox.classList.remove('talking');
            }
        });

        // ========== SCENE DATA ==========
        const scenes = [
            { id: 1, label: 'SCENE 1: PAGI YANG PENUH HARAPAN', speaker: 'PAK BUDI', text: 'Wah, pagi ini buah-buahku segar semua! Mudah-mudahan dagangan laris dan untungnya makin besar!' },
            { id: 2, label: 'SCENE 2: MENGHITUNG MODAL', speaker: 'PAK BUDI', text: 'Hmm… modal buah mangga hari ini Rp10.000 per kilogram. Kalau kujual Rp15.000, lumayan. Tapi kalau harganya terlalu tinggi, jangan-jangan pembelinya malah kabur!' },
            { id: 3, label: 'SCENE 3: MASALAH HARGA', speaker: 'PAK BUDI', text: 'Lho, kok pergi? Apa hargaku terlalu mahal, ya? Kalau harga kuturunkan, pembeli bertambah. Tapi keuntungan per kilogram jadi lebih sedikit. Aduh, bagaimana menentukan harga yang paling menguntungkan?' },
            { id: 4, label: 'SCENE 4: MODEL MATEMATIKA', speaker: 'NARATOR', text: 'Keuntungan total diperoleh dari keuntungan per kilogram dikalikan jumlah barang yang terjual. Karena hubungan ini menghasilkan bentuk fungsi kuadrat, kita dapat mencari nilai maksimum dari fungsi tersebut.' },
            { id: 5, label: 'SCENE 5: TITIK MAKSIMUM', speaker: 'NARATOR', text: 'Karena koefisien x kuadrat bernilai negatif, grafik parabola terbuka ke bawah. Artinya, grafik mempunyai nilai maksimum pada titik puncaknya. Diperoleh x sama dengan lima. Artinya, kenaikan harga sebesar lima ribu rupiah dari harga awal akan menghasilkan keuntungan maksimum.' },
            { id: 6, label: 'SCENE 6: HARGA TERBAIK', speaker: 'PAK BUDI', text: 'Wah! Jadi kalau harga mangga kujual Rp15.000 per kilogram, keuntungan modelku bisa mencapai Rp250.000! Ternyata matematika bisa membantu menentukan strategi dagang!' },
            { id: 7, label: 'SCENE 7: PASAR RAMAI', speaker: 'PAK BUDI', text: 'Sekarang aku tidak asal menentukan harga lagi. Aku bisa mempertimbangkan harga, jumlah pembeli, modal, dan keuntungan!' },
            { id: 8, label: 'SCENE 8: CHALLENGE', speaker: 'PAK BUDI', text: 'Sekarang giliran kalian! Kalau kenaikan harga Rp6.000, berapa jumlah mangga yang terjual? Apakah keuntungan masih bertambah, atau justru menurun?' },
            { id: 9, label: 'SCENE 9: PENUTUP', speaker: 'PAK BUDI', text: 'Belajar matematika ternyata bukan sekadar mencari x. Matematika bisa membantu kita berpikir, mengambil keputusan, dan menemukan solusi dalam kehidupan nyata!' }
        ];

        let currentScene = 0;
        let autoPlayInterval = null;
        let isPlaying = false;
        let animFrame = 0;

        // ========== ANIMASI STATE ==========
        // Pak Budi: posisi, jalan, ekspresi
        let budi = {
            x: -200, y: 550, targetX: 350, scale: 1.2,
            walking: true, speed: 2.5, armRaise: 0,
            blinking: 0, talkTimer: 0
        };

        // Pembeli
        let buyers = [];
        function initBuyers() {
            buyers = [
                { x: 900, y: 520, scale: 0.9, color: '#e74c3c', speed: -1.2, active: true, phase: 0, direction: 1 },
                { x: 1150, y: 540, scale: 1.0, color: '#2ecc71', speed: -1.8, active: true, phase: 2, direction: -1 },
                { x: 750, y: 530, scale: 0.85, color: '#9b59b6', speed: 0.8, active: true, phase: 1, direction: 1 },
                { x: 1300, y: 560, scale: 0.95, color: '#f39c12', speed: -1.5, active: false, phase: 0, direction: -1 }
            ];
        }
        initBuyers();

        // Parabola progress
        let parabolaProgress = 0;

        // Buah-buahan bergerak
        let fruits = [];
        for (let i = 0; i < 25; i++) {
            fruits.push({
                x: 100 + Math.random() * 1100,
                y: 400 + Math.random() * 150,
                r: 8 + Math.random() * 8,
                color: ['#f39c12','#e67e22','#f1c40f','#e74c3c','#2ecc71'][Math.floor(Math.random()*5)],
                phase: Math.random() * Math.PI * 2,
                speed: 0.01 + Math.random() * 0.02
            });
        }

        // Partikel / koin
        let coins = [];
        let coinTimer = 0;

        // Awan
        let clouds = [
            { x: 200, y: 80, size: 50, speed: 0.2 },
            { x: 600, y: 50, size: 40, speed: 0.15 },
            { x: 1000, y: 100, size: 60, speed: 0.25 }
        ];

        // ========== DRAWING HELPERS ==========
        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            this.moveTo(x + r, y);
            this.arcTo(x + w, y, x + w, y + h, r);
            this.arcTo(x + w, y + h, x, y + h, r);
            this.arcTo(x, y + h, x, y, r);
            this.arcTo(x, y, x + w, y, r);
            this.closePath();
            return this;
        };

        // ========== GAMBAR LATAR ==========
        function drawBackground() {
            // Langit gradien
            const skyGrad = ctx.createLinearGradient(0, 0, 0, height * 0.65);
            skyGrad.addColorStop(0, '#87CEEB');
            skyGrad.addColorStop(0.6, '#f9e7b3');
            skyGrad.addColorStop(1, '#fad6a5');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, width, height * 0.65);

            // Matahari dengan sinar animasi
            const sunX = 180, sunY = 110;
            ctx.save();
            ctx.shadowColor = '#ffbb33';
            ctx.shadowBlur = 40 + Math.sin(animFrame * 0.03) * 15;
            ctx.beginPath();
            ctx.arc(sunX, sunY, 55, 0, Math.PI * 2);
            ctx.fillStyle = '#ffe066';
            ctx.fill();
            ctx.restore();

            // Awan bergerak
            clouds.forEach(c => {
                c.x += c.speed;
                if (c.x > width + 100) c.x = -150;
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.size * 0.7, 0, Math.PI*2);
                ctx.arc(c.x + c.size*0.6, c.y - c.size*0.2, c.size*0.6, 0, Math.PI*2);
                ctx.arc(c.x - c.size*0.6, c.y + c.size*0.1, c.size*0.5, 0, Math.PI*2);
                ctx.fill();
            });

            // Tanah pasar
            ctx.fillStyle = '#c49a6c';
            ctx.fillRect(0, height * 0.62, width, height * 0.38);

            // Ubin pasar bergerak halus
            ctx.strokeStyle = 'rgba(120, 80, 50, 0.3)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 20; i++) {
                let gx = (i * 80 + animFrame * 0.5) % (width + 80) - 40;
                ctx.beginPath();
                ctx.moveTo(gx, height * 0.62);
                ctx.lineTo(gx - 30, height);
                ctx.stroke();
            }

            // Kios pasar
            for (let i = 0; i < 4; i++) {
                let kx = 80 + i * 280;
                let ky = height * 0.42;
                // Badan kios
                ctx.fillStyle = '#a0724a';
                ctx.fillRect(kx, ky, 180, 130);
                ctx.fillStyle = '#7a4f2b';
                ctx.fillRect(kx + 15, ky + 20, 150, 80);
                // Atap
                ctx.fillStyle = '#e67e22';
                ctx.beginPath();
                ctx.moveTo(kx - 15, ky);
                ctx.lineTo(kx + 90, ky - 45);
                ctx.lineTo(kx + 195, ky);
                ctx.fill();
                // Tiang
                ctx.fillStyle = '#5a3e1b';
                ctx.fillRect(kx + 10, ky - 10, 8, 140);
                ctx.fillRect(kx + 162, ky - 10, 8, 140);
            }

            // Buah-buahan bergerak (mengkilap)
            fruits.forEach(f => {
                f.y += Math.sin(animFrame * f.speed + f.phase) * 0.3;
                ctx.save();
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 5;
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
                ctx.fillStyle = f.color;
                ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.15)';
                ctx.lineWidth = 1;
                ctx.stroke();
                // highlight
                ctx.beginPath();
                ctx.arc(f.x - f.r*0.3, f.y - f.r*0.3, f.r*0.3, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.fill();
                ctx.restore();
            });
        }

        // ========== GAMBAR PAK BUDI (animasi) ==========
        function drawPakBudi(x, y, scale, walking, armRaise, talkPhase) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            // Efek berjalan: naik-turun ringan
            if (walking) {
                const bob = Math.sin(animFrame * 0.25) * 3;
                ctx.translate(0, bob);
            }

            // Bayangan
            ctx.beginPath();
            ctx.ellipse(0, 10, 35, 10, 0, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fill();

            // Kaki berjalan
            if (walking) {
                const step = Math.sin(animFrame * 0.3) * 15;
                ctx.fillStyle = '#3d3d3d';
                ctx.beginPath();
                ctx.roundRect(-20, 5, 16, 40 + step, 8);
                ctx.fill();
                ctx.beginPath();
                ctx.roundRect(4, 5, 16, 40 - step, 8);
                ctx.fill();
            } else {
                ctx.fillStyle = '#3d3d3d';
                ctx.beginPath();
                ctx.roundRect(-20, 5, 16, 40, 8);
                ctx.fill();
                ctx.beginPath();
                ctx.roundRect(4, 5, 16, 40, 8);
                ctx.fill();
            }

            // Badan
            ctx.fillStyle = '#2e86c1';
            ctx.beginPath();
            ctx.roundRect(-30, -80, 60, 90, 18);
            ctx.fill();

            // Celemek
            ctx.fillStyle = '#f5f5dc';
            ctx.beginPath();
            ctx.roundRect(-25, -50, 50, 70, 12);
            ctx.fill();
            ctx.strokeStyle = '#d4c9a8';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Kepala
            ctx.fillStyle = '#f1c27d';
            ctx.beginPath();
            ctx.arc(0, -110, 34, 0, Math.PI*2);
            ctx.fill();

            // Topi
            ctx.fillStyle = '#a0522d';
            ctx.beginPath();
            ctx.ellipse(0, -136, 38, 12, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.roundRect(-22, -154, 44, 22, 8);
            ctx.fill();

            // Mata berkedip
            const blink = (Math.sin(animFrame * 0.05) > 0.95) ? 0.2 : 1;
            ctx.fillStyle = '#1a1a1a';
            ctx.save();
            ctx.translate(-12, -114);
            ctx.scale(1, blink);
            ctx.beginPath();
            ctx.arc(0, 0, 5, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
            ctx.save();
            ctx.translate(12, -114);
            ctx.scale(1, blink);
            ctx.beginPath();
            ctx.arc(0, 0, 5, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();

            // Mulut (animasi bicara)
            const mouthOpen = talkPhase > 0 ? Math.sin(talkPhase) * 4 + 5 : 3;
            ctx.beginPath();
            ctx.ellipse(0, -96, 10, mouthOpen, 0, 0, Math.PI*2);
            ctx.fillStyle = '#5a3e1b';
            ctx.fill();

            // Kumis
            ctx.strokeStyle = '#5a3e1b';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-8, -102);
            ctx.quadraticCurveTo(-15, -108, -20, -104);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(8, -102);
            ctx.quadraticCurveTo(15, -108, 20, -104);
            ctx.stroke();

            // Lengan kiri
            ctx.save();
            ctx.translate(-30, -60);
            ctx.rotate(armRaise * 0.9 + (walking ? Math.sin(animFrame*0.3)*0.3 : 0));
            ctx.fillStyle = '#2e86c1';
            ctx.beginPath();
            ctx.roundRect(-10, -10, 20, 50, 10);
            ctx.fill();
            ctx.fillStyle = '#f1c27d';
            ctx.beginPath();
            ctx.arc(0, 45, 10, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();

            // Lengan kanan
            ctx.save();
            ctx.translate(30, -60);
            ctx.rotate(-armRaise * 0.9 - (walking ? Math.sin(animFrame*0.3)*0.3 : 0));
            ctx.fillStyle = '#2e86c1';
            ctx.beginPath();
            ctx.roundRect(-10, -10, 20, 50, 10);
            ctx.fill();
            ctx.fillStyle = '#f1c27d';
            ctx.beginPath();
            ctx.arc(0, 45, 10, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();

            // Keranjang di tangan kiri
            if (walking) {
                ctx.fillStyle = '#b87333';
                ctx.beginPath();
                ctx.ellipse(-52, -10, 26, 16, 0.2, 0, Math.PI*2);
                ctx.fill();
                ctx.strokeStyle = '#8b5a2b';
                ctx.lineWidth = 2;
                ctx.stroke();
                // Buah dalam keranjang
                for (let i=0; i<5; i++) {
                    ctx.beginPath();
                    ctx.arc(-65 + i*8, -22 + Math.sin(animFrame*0.1+i)*3, 6, 0, Math.PI*2);
                    ctx.fillStyle = i%2===0 ? '#f39c12' : '#e67e22';
                    ctx.fill();
                }
            }

            ctx.restore();
        }

        // ========== GAMBAR PEMBELI (animasi) ==========
        function drawBuyer(b) {
            ctx.save();
            ctx.translate(b.x, b.y);
            ctx.scale(b.scale, b.scale);

            const bob = Math.sin(animFrame * 0.2 + b.phase) * 3;
            ctx.translate(0, bob);

            // Bayangan
            ctx.beginPath();
            ctx.ellipse(0, 8, 25, 8, 0, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.fill();

            // Kaki
            const step = Math.sin(animFrame * 0.3 + b.phase) * 10;
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.roundRect(-14, 3, 12, 30 + step, 6);
            ctx.fill();
            ctx.beginPath();
            ctx.roundRect(2, 3, 12, 30 - step, 6);
            ctx.fill();

            // Badan
            ctx.fillStyle = b.color;
            ctx.beginPath();
            ctx.roundRect(-22, -60, 44, 70, 14);
            ctx.fill();

            // Kepala
            ctx.fillStyle = '#f1c27d';
            ctx.beginPath();
            ctx.arc(0, -80, 24, 0, Math.PI*2);
            ctx.fill();

            // Mata
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.arc(-8, -84, 3.5, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(8, -84, 3.5, 0, Math.PI*2);
            ctx.fill();

            // Mulut
            ctx.beginPath();
            ctx.arc(0, -74, 6, 0.1, Math.PI - 0.1);
            ctx.strokeStyle = '#5a3e1b';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Tangan membawa tas / menunjuk
            ctx.fillStyle = b.color;
            ctx.beginPath();
            ctx.roundRect(-32, -50, 10, 35, 5);
            ctx.fill();
            ctx.beginPath();
            ctx.roundRect(22, -50, 10, 35, 5);
            ctx.fill();

            ctx.restore();
        }

        // ========== GAMBAR PARABOLA + GRAFIK ==========
        function drawParabola() {
            const originX = 180;
            const originY = height - 140;
            const xScale = 48;
            const yScale = 0.55;

            // Grid
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 1;
            for (let i = -1; i <= 12; i++) {
                let gx = originX + i * xScale;
                ctx.beginPath();
                ctx.moveTo(gx, originY - 380);
                ctx.lineTo(gx, originY + 40);
                ctx.stroke();
            }
            for (let i = 0; i <= 7; i++) {
                let gy = originY - i * 60;
                ctx.beginPath();
                ctx.moveTo(originX - 40, gy);
                ctx.lineTo(originX + 700, gy);
                ctx.stroke();
            }

            // Sumbu
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(originX, originY - 380);
            ctx.lineTo(originX, originY + 35);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(originX - 30, originY);
            ctx.lineTo(originX + 720, originY);
            ctx.stroke();

            // Label sumbu
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 15px "Segoe UI"';
            ctx.fillText('x (kenaikan harga)', originX + 560, originY - 12);
            ctx.save();
            ctx.translate(originX - 80, originY - 200);
            ctx.rotate(-Math.PI/2);
            ctx.fillText('K(x) keuntungan', 0, 0);
            ctx.restore();

            // Gambar kurva parabola
            ctx.beginPath();
            ctx.strokeStyle = '#ffb347';
            ctx.lineWidth = 5;
            ctx.shadowColor = '#ffb347';
            ctx.shadowBlur = 18;
            ctx.lineJoin = 'round';

            const maxX = 10;
            const progress = Math.min(parabolaProgress, 1);
            let started = false;
            for (let xVal = 0; xVal <= maxX * progress; xVal += 0.08) {
                const K = -10 * xVal * xVal + 100 * xVal;
                const px = originX + xVal * xScale;
                const py = originY - K * yScale;
                if (!started) { ctx.moveTo(px, py); started = true; }
                else ctx.lineTo(px, py);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Titik pada kurva yang bergerak (menunjukkan nilai x saat ini)
            if (parabolaProgress > 0.1) {
                const movingX = Math.min(maxX * progress, 8);
                const K = -10 * movingX * movingX + 100 * movingX;
                const px = originX + movingX * xScale;
                const py = originY - K * yScale;

                ctx.beginPath();
                ctx.arc(px, py, 8, 0, Math.PI*2);
                ctx.fillStyle = '#ffdd44';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ffaa00';
                ctx.fill();
                ctx.shadowBlur = 0;

                // Label koordinat dinamis
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 14px "Segoe UI"';
                ctx.fillText(`(${movingX.toFixed(1)}, ${K.toFixed(0)})`, px + 15, py - 10);
            }

            // Titik puncak (x=5, K=250)
            if (parabolaProgress > 0.55) {
                const peakX = originX + 5 * xScale;
                const peakY = originY - 250 * yScale;

                // Lingkaran berdenyut
                const pulse = Math.sin(animFrame * 0.1) * 3 + 12;
                ctx.beginPath();
                ctx.arc(peakX, peakY, pulse, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(255,200,0,0.3)';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(peakX, peakY, 9, 0, Math.PI*2);
                ctx.fillStyle = '#ffdd44';
                ctx.shadowBlur = 25;
                ctx.shadowColor = '#ffaa00';
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 17px "Segoe UI"';
                ctx.fillText('MAKSIMUM', peakX + 18, peakY - 12);
                ctx.fillText('(5, 250)', peakX + 18, peakY + 8);
            }

            // Angka sumbu
            ctx.fillStyle = '#fff';
            ctx.font = '13px "Segoe UI"';
            for (let i = 0; i <= 10; i+=2) {
                ctx.fillText(i, originX + i * xScale - 4, originY + 22);
            }
            for (let i = 0; i <= 250; i+=50) {
                ctx.fillText(i, originX - 36, originY - i * yScale + 5);
            }
        }

        // ========== ANIMASI KOIN ==========
        function updateCoins() {
            coinTimer++;
            if (coinTimer > 12 && (currentScene === 6 || currentScene === 5)) {
                coinTimer = 0;
                coins.push({
                    x: 500 + Math.random() * 300,
                    y: 400,
                    vy: -3 - Math.random() * 3,
                    vx: (Math.random() - 0.5) * 3,
                    life: 60,
                    size: 10 + Math.random() * 8,
                    rotation: Math.random() * Math.PI
                });
                if (voiceEnabled && Math.random() > 0.7) playCoinSound();
            }
            coins.forEach((c, i) => {
                c.x += c.vx;
                c.y += c.vy;
                c.vy += 0.15;
                c.life--;
                c.rotation += 0.1;
                if (c.life <= 0) coins.splice(i, 1);
            });
        }

        function drawCoins() {
            coins.forEach(c => {
                ctx.save();
                ctx.translate(c.x, c.y);
                ctx.rotate(c.rotation);
                ctx.beginPath();
                ctx.ellipse(0, 0, c.size, c.size * 0.6, 0, 0, Math.PI*2);
                ctx.fillStyle = '#f1c40f';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#f1c40f';
                ctx.fill();
                ctx.strokeStyle = '#b8860b';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            });
        }

        // ========== RENDER SCENE ==========
        function renderScene(sceneIndex) {
            const scene = scenes[sceneIndex];
            ctx.clearRect(0, 0, width, height);

            drawBackground();

            // Animasi Pak Budi
            budi.talkTimer = Math.max(0, budi.talkTimer - 0.1);
            const talkPhase = budi.talkTimer > 0 ? animFrame * 0.3 : 0;
            const targetX = sceneIndex === 0 ? 320 : (sceneIndex === 8 ? 600 : 480);
            budi.targetX = targetX;
            const dx = budi.targetX - budi.x;
            if (Math.abs(dx) > 2) {
                budi.x += Math.sign(dx) * 2.5;
                budi.walking = true;
            } else {
                budi.walking = false;
                budi.x = budi.targetX;
            }

            // Scene-specific
            if (sceneIndex === 0) {
                // Scene 1: Pagi, Budi berjalan membawa keranjang
                drawPakBudi(budi.x, budi.y, budi.scale, budi.walking, 0.3, talkPhase);
                buyers.forEach(b => { b.x += b.speed; if (b.x < -100) b.x = 1400; if (b.x > 1400) b.x = -100; drawBuyer(b); });
            }
            else if (sceneIndex === 1) {
                // Scene 2: Menghitung modal
                drawPakBudi(budi.x, budi.y, budi.scale, false, 0.7, talkPhase);
                // Kalkulator
                ctx.fillStyle = '#2c3e50';
                ctx.beginPath();
                ctx.roundRect(700, 430, 90, 120, 10);
                ctx.fill();
                ctx.fillStyle = '#1abc9c';
                ctx.fillRect(710, 440, 70, 35);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px monospace';
                ctx.fillText('10000', 716, 464);
                // Tombol-tombol
                for (let r=0; r<3; r++) {
                    for (let c=0; c<3; c++) {
                        ctx.fillStyle = '#7f8c8d';
                        ctx.beginPath();
                        ctx.arc(725 + c*18, 495 + r*18, 6, 0, Math.PI*2);
                        ctx.fill();
                    }
                }
                // Uang kertas
                for (let i=0; i<3; i++) {
                    ctx.fillStyle = '#2ecc71';
                    ctx.beginPath();
                    ctx.roundRect(560 + i*15, 500 + i*8, 70, 35, 3);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.font = '10px monospace';
                    ctx.fillText('Rp10.000', 570 + i*15, 522 + i*8);
                }
                buyers.forEach(b => { b.x += b.speed * 0.5; if (b.x < -100) b.x = 1400; if (b.x > 1400) b.x = -100; drawBuyer(b); });
            }
            else if (sceneIndex === 2) {
                // Scene 3: Masalah, pembeli pergi
                drawPakBudi(budi.x, budi.y, budi.scale, false, 0.9, talkPhase);
                // Pembeli pergi
                buyers.forEach(b => {
                    if (b.active) {
                        b.x += b.speed * 2;
                        if (b.x > 1400 || b.x < -100) { b.x = 900 + Math.random()*300; }
                    }
                    drawBuyer(b);
                });
                // Tanda tanya
                ctx.fillStyle = '#f1c40f';
                ctx.font = 'bold 60px "Segoe UI"';
                ctx.fillText('?', 850, 420 + Math.sin(animFrame*0.1)*10);
            }
            else if (sceneIndex === 3) {
                // Scene 4: Model matematika
                drawPakBudi(budi.x, budi.y, budi.scale, false, 0.2, talkPhase);
                // Partikel angka melayang
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.font = 'bold 20px monospace';
                const symbols = ['x', '²', '+', '−', '=', 'K', 'p', 'q'];
                for (let i=0; i<10; i++) {
                    let sx = 200 + (i*97 + animFrame*0.5) % 900;
                    let sy = 200 + Math.sin(animFrame*0.02 + i)*80;
                    ctx.fillText(symbols[i%symbols.length], sx, sy);
                }
                buyers.forEach(b => drawBuyer(b));
            }
            else if (sceneIndex === 4 || sceneIndex === 5) {
                // Scene 5 & 6: Parabola
                drawParabola();
                drawPakBudi(950, 570, 1.0, false, 0.1, talkPhase);
                buyers.forEach(b => drawBuyer(b));
            }
            else if (sceneIndex === 6) {
                // Scene 7: Pasar ramai
                drawPakBudi(budi.x, budi.y, budi.scale, false, 0.5, talkPhase);
                // Banyak pembeli
                for (let i=0; i<5; i++) {
                    const bx = 700 + i*110 + Math.sin(animFrame*0.03 + i)*20;
                    const b = { x: bx, y: 530 + (i%2)*10, scale: 0.85, color: ['#e74c3c','#2ecc71','#9b59b6','#f39c12','#3498db'][i], phase: i };
                    drawBuyer(b);
                }
                // Koin berjatuhan
                ctx.fillStyle = '#f1c40f';
                ctx.font = 'bold 36px "Segoe UI"';
                ctx.fillText('💰 Rp250.000 💰', 500, 400 + Math.sin(animFrame*0.08)*8);
            }
            else if (sceneIndex === 7) {
                // Scene 8: Challenge
                drawParabola();
                drawPakBudi(1000, 570, 1.0, false, 0.6, talkPhase);
                // Tanda tanya animasi
                ctx.fillStyle = '#ffb347';
                ctx.font = 'bold 48px "Segoe UI"';
                ctx.fillText('?', 950, 380 + Math.sin(animFrame*0.12)*12);
                ctx.fillText('?', 1050, 420 + Math.sin(animFrame*0.12 + 1)*12);
            }
            else if (sceneIndex === 8) {
                // Scene 9: Penutup
                drawPakBudi(budi.x, budi.y, budi.scale, true, 0.2, talkPhase);
                buyers.forEach(b => drawBuyer(b));
                // Bintang berkilau
                for (let i=0; i<15; i++) {
                    let sx = 100 + (i*83 + animFrame*0.3) % 1100;
                    let sy = 150 + Math.sin(animFrame*0.05 + i)*100;
                    ctx.fillStyle = `rgba(255,220,100,${0.5 + Math.sin(animFrame*0.1+i)*0.5})`;
                    ctx.beginPath();
                    ctx.arc(sx, sy, 3, 0, Math.PI*2);
                    ctx.fill();
                }
            }

            // Update koin
            updateCoins();
            drawCoins();

            // Update UI
            sceneLabel.textContent = scene.label;
            speakerName.textContent = scene.speaker;
            dialogText.textContent = scene.text;

            if (scene.speaker === 'NARATOR') {
                naratorBadge.textContent = '🎙️ NARATOR';
                naratorBadge.style.background = '#3a6ea5';
            } else {
                naratorBadge.textContent = '👨‍🌾 PAK BUDI';
                naratorBadge.style.background = '#8b5a2b';
            }
        }

        // ========== ANIMATION LOOP ==========
        function animate() {
            animFrame++;
            if (currentScene === 4 || currentScene === 5 || currentScene === 7) {
                parabolaProgress = Math.min(parabolaProgress + 0.012, 1);
            } else {
                parabolaProgress = 0;
            }
            renderScene(currentScene);
            requestAnimationFrame(animate);
        }

        // ========== NAVIGASI + SUARA ==========
        function setMathPanel(sceneIndex) {
            mathPanel.classList.remove('show');
            if (sceneIndex === 3) {
                mathPanel.innerHTML = `p(x) = 10 + x<br>q(x) = 100 − 10x<br>K(x) = x(100 − 10x)<br><span class="highlight">K(x) = −10x² + 100x</span>`;
                setTimeout(() => mathPanel.classList.add('show'), 600);
            } else if (sceneIndex === 4) {
                mathPanel.innerHTML = `x = −b/(2a)<br>x = −100/(2×−10)<br><span class="highlight">x = 5</span><br>K(5) = −10(5)² + 100(5)<br>K(5) = 250`;
                setTimeout(() => mathPanel.classList.add('show'), 900);
            } else if (sceneIndex === 5) {
                mathPanel.innerHTML = `Harga = Rp15.000/kg<br>Terjual = 50 kg<br><span class="highlight">Untung = Rp250.000</span>`;
                setTimeout(() => mathPanel.classList.add('show'), 700);
            } else if (sceneIndex === 6) {
                mathPanel.innerHTML = `💰 KEUNTUNGAN MAKSIMUM<br><span class="highlight">Rp250.000</span>`;
                setTimeout(() => mathPanel.classList.add('show'), 500);
            } else if (sceneIndex === 7) {
                mathPanel.innerHTML = `1. Mengapa keuntungan tidak selalu naik?<br>2. Apa arti titik puncak?<br>3. Bagaimana fungsi kuadrat membantu?<br>4. Apakah untung selalu bertambah?`;
                setTimeout(() => mathPanel.classList.add('show'), 800);
            } else if (sceneIndex === 8) {
                mathPanel.innerHTML = `MATEMATIKA DI SEKITAR KITA<br>FUNGSI KUADRAT<br><span class="highlight">Berpikir matematis, mengambil keputusan cerdas!</span>`;
                setTimeout(() => mathPanel.classList.add('show'), 700);
            }
        }

        function goToScene(index) {
            if (index < 0) index = 0;
            if (index >= scenes.length) index = scenes.length - 1;
            currentScene = index;
            parabolaProgress = 0;
            coins = [];
            budi.talkTimer = 120;

            // Reset pembeli
            initBuyers();

            // Reset posisi Budi
            budi.x = index === 0 ? -200 : 400;
            budi.walking = true;

            // Sembunyikan panel matematika dulu
            mathPanel.classList.remove('show');
            setTimeout(() => setMathPanel(currentScene), 300);

            prevBtn.disabled = (currentScene === 0);
            nextBtn.disabled = (currentScene === scenes.length - 1);

            // Suara: bacakan dialog
            if (voiceEnabled) {
                window.speechSynthesis.cancel();
                const scene = scenes[currentScene];
                setTimeout(() => {
                    speak(scene.text, scene.speaker);
                    playMarketAmbience();
                }, 600);
            }

            // Auto-play
            if (isPlaying) {
                clearInterval(autoPlayInterval);
                startAutoPlay();
            }
        }

        function startAutoPlay() {
            if (autoPlayInterval) clearInterval(autoPlayInterval);
            isPlaying = true;
            playBtn.textContent = '⏸️ JEDA';
            playBtn.style.background = '#e67e22';

            autoPlayInterval = setInterval(() => {
                if (currentScene < scenes.length - 1) {
                    goToScene(currentScene + 1);
                } else {
                    clearInterval(autoPlayInterval);
                    isPlaying = false;
                    playBtn.textContent = '▶ PUTAR OTOMATIS';
                    playBtn.style.background = '#ffb347';
                }
            }, 7500);
        }

        // ========== EVENT LISTENERS ==========
        prevBtn.addEventListener('click', () => { if (currentScene > 0) goToScene(currentScene - 1); });
        nextBtn.addEventListener('click', () => { if (currentScene < scenes.length - 1) goToScene(currentScene + 1); });
        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                clearInterval(autoPlayInterval);
                isPlaying = false;
                playBtn.textContent = '▶ PUTAR OTOMATIS';
                playBtn.style.background = '#ffb347';
                window.speechSynthesis.cancel();
                dialogBox.classList.remove('talking');
            } else {
                startAutoPlay();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') prevBtn.click();
            if (e.key === 'ArrowRight') nextBtn.click();
            if (e.key === ' ') { e.preventDefault(); playBtn.click(); }
        });

        // Mulai
        animate();
        goToScene(0);
    })();
</script>
</body>
