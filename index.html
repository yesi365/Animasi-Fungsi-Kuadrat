<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misi Pedagang: Untung Maksimal dengan Fungsi Kuadrat - Full Movie</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
        }

        body {
            background: #0b1a2f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #video-container {
            width: 1280px;
            height: 720px;
            background: #1a2f4e;
            border-radius: 28px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.8), 0 0 0 2px #ffb347;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        #scene-canvas {
            flex: 1;
            display: block;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, #f9e7b3, #d4a373);
        }

        /* ====== UI OVERLAY ====== */
        .top-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            pointer-events: none;
            z-index: 15;
        }

        .time-badge {
            background: rgba(0,0,0,0.65);
            padding: 8px 18px;
            border-radius: 30px;
            color: #ffe6b3;
            font-weight: 600;
            font-size: 0.82rem;
            border: 1px solid #ffb347;
            letter-spacing: 1px;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .time-badge .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #ff4444;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .voice-toggle {
            background: rgba(0,0,0,0.65);
            border: 1px solid #ffb347;
            color: #ffe6b3;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.8rem;
            pointer-events: auto;
            transition: all 0.2s;
        }

        .voice-toggle.active {
            background: #ffb347;
            color: #0b1a2f;
            font-weight: 700;
        }

        /* ====== DIALOG ====== */
        .dialog-area {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 20px 36px 24px;
            background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.3) 70%, transparent);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            pointer-events: none;
        }

        .dialog-box {
            background: rgba(10, 20, 30, 0.92);
            backdrop-filter: blur(6px);
            padding: 16px 26px;
            border-radius: 32px;
            border-left: 7px solid #ffb347;
            max-width: 72%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            pointer-events: auto;
            transition: transform 0.2s;
        }

        .dialog-box.talking {
            animation: pulse 0.4s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.015); }
        }

        .speaker {
            font-weight: 800;
            color: #ffb347;
            letter-spacing: 0.5px;
            font-size: 0.95rem;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .dialog-text {
            font-size: 1.1rem;
            line-height: 1.5;
            color: #fff;
            font-weight: 400;
            text-shadow: 1px 1px 3px black;
            min-height: 2.6em;
        }

        .speaker-badge {
            background: #8b5a2b;
            color: white;
            padding: 8px 22px;
            border-radius: 40px;
            font-weight: 700;
            letter-spacing: 1px;
            font-size: 0.85rem;
            border: 2px solid #ffd9a0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            pointer-events: auto;
            white-space: nowrap;
        }

        /* ====== MATH PANEL ====== */
        .math-panel {
            position: absolute;
            top: 76px;
            right: 24px;
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(10px);
            padding: 18px 26px;
            border-radius: 20px;
            border: 2px solid #ffb347;
            color: #fff;
            font-size: 1.05rem;
            font-weight: 600;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
            text-align: center;
            opacity: 0;
            transform: translateX(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            pointer-events: none;
            font-family: 'Courier New', monospace;
            line-height: 1.7;
            max-width: 380px;
            z-index: 12;
        }

        .math-panel.show {
            opacity: 1;
            transform: translateX(0);
        }

        .math-panel .highlight {
            color: #ffd966;
            font-size: 1.5rem;
        }

        /* ====== PROGRESS BAR & CONTROLS ====== */
        .bottom-controls {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 12px 36px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            pointer-events: none;
            z-index: 20;
        }

        .progress-track {
            flex: 1;
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            overflow: hidden;
            pointer-events: auto;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffb347, #ffd966);
            border-radius: 10px;
            transition: width 0.15s linear;
            box-shadow: 0 0 12px #ffb347;
        }

        .progress-markers {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 100%;
            display: flex;
            pointer-events: none;
        }

        .progress-markers span {
            flex: 1;
            border-right: 1px solid rgba(0,0,0,0.4);
        }

        .controls-btn {
            background: #ffb347;
            border: none;
            border-radius: 40px;
            padding: 10px 18px;
            font-weight: 700;
            font-size: 0.85rem;
            color: #0b1a2f;
            cursor: pointer;
            box-shadow: 0 4px 0 #b46f1a;
            transition: all 0.1s;
            pointer-events: auto;
            white-space: nowrap;
        }

        .controls-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #b46f1a;
        }

        .controls-btn.playing {
            background: #e67e22;
        }

        .time-display {
            color: #ffe6b3;
            font-size: 0.8rem;
            font-weight: 600;
            font-family: 'Courier New', monospace;
            min-width: 90px;
            text-align: center;
            pointer-events: auto;
        }

        /* ====== SUBTITLE HINT ====== */
        .subtitle-hint {
            position: absolute;
            bottom: 72px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            font-size: 0.72rem;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 10;
        }

        @media (max-width: 1400px) {
            #video-container { transform: scale(0.9); transform-origin: center; }
        }
    </style>
</head>
<body>
<div id="video-container">
    <canvas id="scene-canvas" width="1280" height="720"></canvas>

    <!-- Top bar -->
    <div class="top-bar">
        <div class="time-badge">
            <span class="dot"></span>
            <span id="chapterLabel">BAB 1 — PAGI YANG PENUH HARAPAN</span>
        </div>
        <button class="voice-toggle active" id="voiceToggle">🔊 SUARA: AKTIF</button>
    </div>

    <!-- Math panel -->
    <div class="math-panel" id="mathPanel"></div>

    <!-- Dialog -->
    <div class="dialog-area">
        <div class="dialog-box" id="dialogBox">
            <div class="speaker" id="speakerName">PAK BUDI</div>
            <div class="dialog-text" id="dialogText">...</div>
        </div>
        <div class="speaker-badge" id="speakerBadge">👨‍🌾 PAK BUDI</div>
    </div>

    <!-- Bottom controls -->
    <div class="bottom-controls">
        <button class="controls-btn" id="playPauseBtn">▶</button>
        <div class="progress-track" id="progressTrack">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="time-display" id="timeDisplay">00:00 / 00:00</div>
        <button class="controls-btn" id="restartBtn">↺ ULANG</button>
    </div>
</div>

<script>
(function(){
    const canvas = document.getElementById('scene-canvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    const chapterLabel = document.getElementById('chapterLabel');
    const speakerName = document.getElementById('speakerName');
    const dialogText = document.getElementById('dialogText');
    const dialogBox = document.getElementById('dialogBox');
    const speakerBadge = document.getElementById('speakerBadge');
    const mathPanel = document.getElementById('mathPanel');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const restartBtn = document.getElementById('restartBtn');
    const progressTrack = document.getElementById('progressTrack');
    const progressFill = document.getElementById('progressFill');
    const timeDisplay = document.getElementById('timeDisplay');
    const voiceToggle = document.getElementById('voiceToggle');

    // ============ AUDIO ============
    let voiceEnabled = true;
    let indonesianVoice = null;
    function loadVoices() {
        const v = window.speechSynthesis.getVoices();
        indonesianVoice = v.find(x => x.lang === 'id-ID' || x.lang === 'id_ID') || v.find(x => x.lang.startsWith('id')) || v[0];
    }
    if (window.speechSynthesis) {
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();
    }

    let audioCtx = null;
    function getAC() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
    }
    function playTone(freq, dur, type='sine', vol=0.06) {
        if (!voiceEnabled) return;
        try {
            const ac = getAC();
            const osc = ac.createOscillator();
            const g = ac.createGain();
            osc.type = type; osc.frequency.value = freq;
            g.gain.value = vol;
            osc.connect(g); g.connect(ac.destination);
            osc.start();
            g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
            osc.stop(ac.currentTime + dur);
        } catch(e){}
    }
    function playCoin() {
        playTone(1200, 0.1, 'square', 0.05);
        setTimeout(()=>playTone(1600, 0.15, 'square', 0.04), 80);
    }
    function playAmbience() {
        playTone(220, 0.3, 'sine', 0.02);
        setTimeout(()=>playTone(260, 0.25, 'sine', 0.018), 150);
    }

    function speak(text, speaker) {
        if (!voiceEnabled || !window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'id-ID';
        u.rate = 0.95;
        u.pitch = speaker === 'PAK BUDI' ? 1.15 : 1.0;
        u.volume = 1;
        if (indonesianVoice) u.voice = indonesianVoice;
        u.onstart = () => { if (speaker === 'PAK BUDI') dialogBox.classList.add('talking'); };
        u.onend = () => dialogBox.classList.remove('talking');
        window.speechSynthesis.speak(u);
    }

    voiceToggle.addEventListener('click', () => {
        voiceEnabled = !voiceEnabled;
        if (voiceEnabled) {
            voiceToggle.textContent = '🔊 SUARA: AKTIF';
            voiceToggle.classList.add('active');
            const seg = segments[currentSegmentIndex];
            if (seg) speak(seg.text, seg.speaker);
        } else {
            voiceToggle.textContent = '🔇 SUARA: MATI';
            voiceToggle.classList.remove('active');
            window.speechSynthesis.cancel();
            dialogBox.classList.remove('talking');
        }
    });

    // ============ SEGMEN (25 babak digabung) ============
    // Setiap segmen = satu bagian cerita, dengan durasi sendiri.
    // Total 25 babak kecil digabung menjadi satu alur film.
    const segments = [
        // 1
        { chapter: 'BAB 1 — PAGI YANG PENUH HARAPAN', speaker: 'PAK BUDI',
          text: 'Wah, pagi ini buah-buahku segar semua! Mudah-mudahan dagangan laris dan untungnya makin besar!', duration: 7 },
        // 2
        { chapter: 'BAB 1 — PAGI YANG PENUH HARAPAN', speaker: 'NARATOR',
          text: 'Setiap pedagang tentu ingin mendapatkan keuntungan maksimal. Tapi ternyata, menentukan harga jual bukan sekadar menaikkan harga sesuka hati.', duration: 8 },
        // 3
        { chapter: 'BAB 2 — MENGHITUNG MODAL', speaker: 'PAK BUDI',
          text: 'Hmm… modal buah mangga hari ini Rp10.000 per kilogram. Kalau kujual Rp15.000, lumayan. Tapi kalau harganya terlalu tinggi, jangan-jangan pembelinya malah kabur!', duration: 10 },
        // 4
        { chapter: 'BAB 2 — MENGHITUNG MODAL', speaker: 'NARATOR',
          text: 'Pak Budi mulai menyadari bahwa harga jual berpengaruh terhadap jumlah barang yang dapat terjual. Semakin tinggi harga, kemungkinan jumlah pembeli menurun.', duration: 8 },
        // 5
        { chapter: 'BAB 3 — MASALAH HARGA', speaker: 'PAK BUDI',
          text: 'Lho, kok pergi? Apa hargaku terlalu mahal, ya?', duration: 5 },
        // 6
        { chapter: 'BAB 3 — MASALAH HARGA', speaker: 'PAK BUDI',
          text: 'Kalau harga kuturunkan, pembeli bertambah. Tapi keuntungan per kilogram jadi lebih sedikit. Aduh, bagaimana menentukan harga yang paling menguntungkan?', duration: 9 },
        // 7
        { chapter: 'BAB 3 — MASALAH HARGA', speaker: 'NARATOR',
          text: 'Permasalahan Pak Budi ternyata bisa kita bantu menggunakan matematika, khususnya fungsi kuadrat!', duration: 7 },
        // 8
        { chapter: 'BAB 4 — MEMBANGUN MODEL MATEMATIKA', speaker: 'NARATOR',
          text: 'Misalkan x adalah kenaikan harga jual per kilogram dalam ribuan rupiah. Harga awal mangga Rp10.000 per kilogram, dan jumlah mangga yang terjual ketika harga awal adalah 100 kilogram.', duration: 10, math: 'Harga jual:\np(x) = 10 + x\n\nJumlah terjual:\nq(x) = 100 − 10x' },
        // 9
        { chapter: 'BAB 4 — MEMBANGUN MODEL MATEMATIKA', speaker: 'NARATOR',
          text: 'Setiap kenaikan harga Rp1.000, jumlah penjualan berkurang 10 kilogram. Keuntungan per kilogram adalah harga jual dikurangi modal.', duration: 9, math: 'Keuntungan/kg:\np(x) − 10 = x' },
        // 10
        { chapter: 'BAB 4 — MEMBANGUN MODEL MATEMATIKA', speaker: 'NARATOR',
          text: 'Keuntungan total diperoleh dari keuntungan per kilogram dikalikan jumlah barang yang terjual. Karena hubungan ini menghasilkan bentuk fungsi kuadrat, kita dapat mencari nilai maksimum dari fungsi tersebut.', duration: 10, math: 'K(x) = x(100 − 10x)\n\nK(x) = 100x − 10x²\n\nK(x) = −10x² + 100x' },
        // 11
        { chapter: 'BAB 4 — MEMBANGUN MODEL MATEMATIKA', speaker: 'PAK BUDI',
          text: 'Jadi, bukan cuma menghitung harga! Kita juga harus memperhitungkan berapa banyak barang yang bisa terjual!', duration: 8 },
        // 12
        { chapter: 'BAB 5 — PETUALANGAN MENCARI TITIK MAKSIMUM', speaker: 'NARATOR',
          text: 'Grafik fungsi keuntungan K(x) = −10x² + 100x membentuk parabola yang terbuka ke bawah. Titik-titik pada grafik bergerak mengikuti perubahan harga.', duration: 10, math: 'K(x) = −10x² + 100x\n\na = −10  →  a < 0\nParabola terbuka ke bawah' },
        // 13
        { chapter: 'BAB 5 — PETUALANGAN MENCARI TITIK MAKSIMUM', speaker: 'NARATOR',
          text: 'Ketika x semakin besar, keuntungan meningkat, kemudian mencapai puncak, lalu keuntungan menurun. Karena koefisien x kuadrat bernilai negatif, grafik mempunyai nilai maksimum pada titik puncaknya.', duration: 11, math: 'x_puncak = −b / (2a)\na = −10,  b = 100\n\nx = −100 / (2 × −10)\nx = 5' },
        // 14
        { chapter: 'BAB 5 — PETUALANGAN MENCARI TITIK MAKSIMUM', speaker: 'NARATOR',
          text: 'Diperoleh x sama dengan lima. Artinya, kenaikan harga sebesar Rp5.000 dari harga awal akan menghasilkan keuntungan maksimum berdasarkan model ini.', duration: 9, math: 'x = 5\n→ Harga = Rp10.000 + Rp5.000\n→ Harga = Rp15.000/kg' },
        // 15
        { chapter: 'BAB 6 — MENEMUKAN HARGA JUAL TERBAIK', speaker: 'NARATOR',
          text: 'Saat harga mencapai Rp15.000 per kilogram, jumlah barang terjual 50 kilogram, keuntungan per kilogram Rp5.000, dan keuntungan total Rp250.000.', duration: 10, math: 'K(5) = −10(5)² + 100(5)\nK(5) = −250 + 500\nK(5) = 250\n\n→ Rp250.000' },
        // 16
        { chapter: 'BAB 6 — MENEMUKAN HARGA JUAL TERBAIK', speaker: 'PAK BUDI',
          text: 'Wah! Jadi kalau harga mangga kujual Rp15.000 per kilogram, keuntungan modelku bisa mencapai Rp250.000! Ternyata matematika bisa membantu menentukan strategi dagang!', duration: 10 },
        // 17
        { chapter: 'BAB 7 — PASAR MENJADI RAMAI', speaker: 'NARATOR',
          text: 'Kios Pak Budi semakin ramai. Pembeli datang, menimbang buah, melakukan transaksi, dan tersenyum. Keuntungan maksimum Rp250.000 muncul dengan efek koin berputar.', duration: 9 },
        // 18
        { chapter: 'BAB 7 — PASAR MENJADI RAMAI', speaker: 'PAK BUDI',
          text: 'Sekarang aku tidak asal menentukan harga lagi. Aku bisa mempertimbangkan harga, jumlah pembeli, modal, dan keuntungan!', duration: 8 },
        // 19
        { chapter: 'BAB 7 — PASAR MENJADI RAMAI', speaker: 'NARATOR',
          text: 'Fungsi kuadrat tidak hanya ada dalam buku matematika. Kita dapat menggunakannya untuk memodelkan situasi nyata, seperti menentukan keuntungan maksimum dalam kegiatan perdagangan.', duration: 10 },
        // 20
        { chapter: 'BAB 8 — PENERAPAN FUNGSI KUADRAT', speaker: 'NARATOR',
          text: 'Fungsi kuadrat banyak diterapkan dalam kehidupan nyata. Bentuk umum fungsi kuadrat adalah y = ax² + bx + c. Jika a negatif, grafik terbuka ke bawah dan memiliki nilai maksimum. Jika a positif, grafik terbuka ke atas dan memiliki nilai minimum.', duration: 13, math: 'y = ax² + bx + c\n\na < 0 → maksimum\na > 0 → minimum\n\nx_puncak = −b/(2a)' },
        // 21
        { chapter: 'BAB 8 — PENERAPAN FUNGSI KUADRAT', speaker: 'NARATOR',
          text: 'Selain menentukan keuntungan maksimum, fungsi kuadrat juga digunakan untuk menghitung luas maksimum lahan, tinggi maksimum bola yang dilempar, dan menentukan biaya produksi minimum.', duration: 11, math: '💼 Ekonomi → untung maks\n📐 Geometri → luas maks\n⚽ Fisika → tinggi maks\n🏭 Produksi → biaya min' },
        // 22
        { chapter: 'BAB 9 — CHALLENGE UNTUK SISWA', speaker: 'PAK BUDI',
          text: 'Sekarang giliran kalian! Kalau kenaikan harga Rp6.000, berapa jumlah mangga yang terjual? Apakah keuntungan masih bertambah, atau justru menurun?', duration: 11, math: 'x = 6\nq(6) = 100 − 10(6) = ?\nK(6) = −10(6)² + 100(6) = ?' },
        // 23
        { chapter: 'BAB 9 — CHALLENGE UNTUK SISWA', speaker: 'NARATOR',
          text: 'Mengapa keuntungan tidak selalu meningkat ketika harga jual dinaikkan? Apa arti titik puncak pada grafik fungsi keuntungan? Bagaimana fungsi kuadrat membantu pedagang mengambil keputusan? Jika harga jual terus dinaikkan, apakah keuntungan akan selalu bertambah?', duration: 15, math: '1. Mengapa untung tidak selalu naik?\n2. Apa arti titik puncak?\n3. Bagaimana fungsi kuadrat membantu?\n4. Apakah untung selalu bertambah?' },
        // 24
        { chapter: 'BAB 10 — PENUTUP', speaker: 'PAK BUDI',
          text: 'Belajar matematika ternyata bukan sekadar mencari x. Matematika bisa membantu kita berpikir, mengambil keputusan, dan menemukan solusi dalam kehidupan nyata!', duration: 10 },
        // 25
        { chapter: 'BAB 10 — PENUTUP', speaker: 'NARATOR',
          text: 'Yuk, teruslah menjelajahi matematika. Karena di balik setiap masalah, mungkin ada pola yang bisa kita temukan! Berpikir matematis, mengambil keputusan cerdas!', duration: 11, math: 'MATEMATIKA DI SEKITAR KITA\nFUNGSI KUADRAT\n<span class="highlight">Berpikir matematis,<br>mengambil keputusan cerdas!</span>' }
    ];

    // ============ STATE FILM ============
    let currentSegmentIndex = 0;
    let segmentElapsed = 0;      // detik dalam segmen saat ini
    let totalElapsed = 0;        // total detik seluruh film
    let totalDuration = segments.reduce((s, x) => s + x.duration, 0);
    let isPlaying = true;
    let lastTimestamp = 0;
    let animFrame = 0;

    // Animasi karakter
    let budi = { x: -200, y: 480, targetX: 340, scale: 1.05, walking: true, armRaise: 0, talkTimer: 0 };
    let buyers = [];
    function initBuyers() {
        buyers = [
            { x: 820, y: 460, scale: 0.8, color: '#e74c3c', speed: -1.2, phase: 0 },
            { x: 1080, y: 480, scale: 0.9, color: '#2ecc71', speed: -1.8, phase: 2 },
            { x: 680, y: 470, scale: 0.75, color: '#9b59b6', speed: 0.8, phase: 1 },
            { x: 1180, y: 490, scale: 0.85, color: '#f39c12', speed: -1.5, phase: 3 }
        ];
    }
    initBuyers();

    let parabolaProgress = 0;
    let coins = [];
    let coinTimer = 0;

    let fruits = [];
    for (let i=0; i<28; i++) {
        fruits.push({
            x: 80 + Math.random()*1120, y: 350 + Math.random()*130,
            r: 7 + Math.random()*7,
            color: ['#f39c12','#e67e22','#f1c40f','#e74c3c','#2ecc71'][Math.floor(Math.random()*5)],
            phase: Math.random()*Math.PI*2, speed: 0.01 + Math.random()*0.02
        });
    }

    let clouds = [
        { x: 200, y: 70, size: 45, speed: 0.2 },
        { x: 600, y: 45, size: 35, speed: 0.15 },
        { x: 1000, y: 85, size: 55, speed: 0.25 }
    ];

    // ============ DRAWING HELPERS ============
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (w < 2*r) r = w/2;
        if (h < 2*r) r = h/2;
        this.moveTo(x+r, y);
        this.arcTo(x+w, y, x+w, y+h, r);
        this.arcTo(x+w, y+h, x, y+h, r);
        this.arcTo(x, y+h, x, y, r);
        this.arcTo(x, y, x+w, y, r);
        this.closePath();
        return this;
    };

    function drawBackground(sceneType) {
        // Langit
        const skyGrad = ctx.createLinearGradient(0, 0, 0, H*0.65);
        skyGrad.addColorStop(0, '#87CEEB');
        skyGrad.addColorStop(0.6, '#f9e7b3');
        skyGrad.addColorStop(1, '#fad6a5');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, W, H*0.65);

        // Matahari
        ctx.save();
        ctx.shadowColor = '#ffbb33';
        ctx.shadowBlur = 40 + Math.sin(animFrame*0.03)*15;
        ctx.beginPath();
        ctx.arc(170, 100, 50, 0, Math.PI*2);
        ctx.fillStyle = '#ffe066';
        ctx.fill();
        ctx.restore();

        // Awan
        clouds.forEach(c => {
            c.x += c.speed;
            if (c.x > W + 100) c.x = -150;
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.beginPath();
            ctx.arc(c.x, c.y, c.size*0.7, 0, Math.PI*2);
            ctx.arc(c.x + c.size*0.6, c.y - c.size*0.2, c.size*0.6, 0, Math.PI*2);
            ctx.arc(c.x - c.size*0.6, c.y + c.size*0.1, c.size*0.5, 0, Math.PI*2);
            ctx.fill();
        });

        // Tanah
        ctx.fillStyle = '#c49a6c';
        ctx.fillRect(0, H*0.62, W, H*0.38);

        // Ubin pasar
        ctx.strokeStyle = 'rgba(120, 80, 50, 0.3)';
        ctx.lineWidth = 1;
        for (let i=0; i<22; i++) {
            const gx = (i*72 + animFrame*0.5) % (W+80) - 40;
            ctx.beginPath();
            ctx.moveTo(gx, H*0.62);
            ctx.lineTo(gx - 25, H);
            ctx.stroke();
        }

        // Kios pasar
        for (let i=0; i<5; i++) {
            const kx = 60 + i*260;
            const ky = H*0.42;
            ctx.fillStyle = '#a0724a';
            ctx.fillRect(kx, ky, 160, 120);
            ctx.fillStyle = '#7a4f2b';
            ctx.fillRect(kx + 14, ky + 18, 132, 75);
            ctx.fillStyle = '#e67e22';
            ctx.beginPath();
            ctx.moveTo(kx - 14, ky);
            ctx.lineTo(kx + 80, ky - 42);
            ctx.lineTo(kx + 174, ky);
            ctx.fill();
            ctx.fillStyle = '#5a3e1b';
            ctx.fillRect(kx + 8, ky - 10, 7, 130);
            ctx.fillRect(kx + 145, ky - 10, 7, 130);
        }

        // Buah-buahan berkilau
        fruits.forEach(f => {
            f.y += Math.sin(animFrame*f.speed + f.phase)*0.3;
            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 5;
            ctx.beginPath();
            ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
            ctx.fillStyle = f.color;
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.15)';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(f.x - f.r*0.3, f.y - f.r*0.3, f.r*0.3, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.fill();
            ctx.restore();
        });
    }

    function drawPakBudi(x, y, scale, walking, armRaise, talkPhase) {

        ctx.scale(scale, scale);

        if (walking) {
            const bob = Math.sin(animFrame*0.25)*3;
            ctx.translate(0, bob);
        }

        // Bayangan
        ctx.beginPath();
        ctx.ellipse(0, 10, 32, 9, 0, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fill();

        // Kaki
        if (walking) {
            const step = Math.sin(animFrame*0.3)*15;
            ctx.fillStyle = '#3d3d3d';
            ctx.beginPath(); ctx.roundRect(-18, 5, 15, 36 + step, 8); ctx.fill();
            ctx.beginPath(); ctx.roundRect(4, 5, 15, 36 - step, 8); ctx.fill();
        } else {
            ctx.fillStyle = '#3d3d3d';
            ctx.beginPath(); ctx.roundRect(-18, 5, 15, 36, 8); ctx.fill();
            ctx.beginPath(); ctx.roundRect(4, 5, 15, 36, 8); ctx.fill();
        }

        // Badan
        ctx.fillStyle = '#2e86c1';
        ctx.beginPath(); ctx.roundRect(-28, -75, 56, 82, 17); ctx.fill();

        // Celemek
        ctx.fillStyle = '#f5f5dc';
        ctx.beginPath(); ctx.roundRect(-23, -46, 46, 64, 11); ctx.fill();
        ctx.strokeStyle = '#d4c9a8'; ctx.lineWidth = 2; ctx.stroke();

        // Kepala
        ctx.fillStyle = '#f1c27d';
        ctx.beginPath(); ctx.arc(0, -103, 31, 0, Math.PI*2); ctx.fill();

        // Topi
        ctx.fillStyle = '#a0522d';
        ctx.beginPath(); ctx.ellipse(0, -126, 35, 11, 0, 0, Math.PI*2); ctx.fill();

        // Mata berkedip
        const blink = (Math.sin(animFrame*0.05) > 0.95) ? 0.2 : 1;

        ctx.save(); ctx.translate(11, -106); ctx.scale(1, blink);

        // Mulut bicara
        const mouthOpen = talkPhase > 0 ? Math.sin(talkPhase)*4 + 5 : 3;
        ctx.beginPath(); ctx.ellipse(0, -89, 9, mouthOpen, 0, 0, Math.PI*2);
        ctx.fillStyle = '#5a3e1b'; ctx.fill();

        // Kumis
        ctx.strokeStyle = '#5a3e1b'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-7, -95); ctx.quadraticCurveTo(-14, -100, -18, -97); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(7, -95); ctx.quadraticCurveTo(14, -100, 18, -97); ctx.stroke();

        // Lengan
        ctx.save();
        ctx.translate(-28, -56);
        ctx.rotate(armRaise*0.9 + (walking ? Math.sin(animFrame*0.3)*0.3 : 0));
        ctx.fillStyle = '#2e86c1';
        ctx.beginPath(); ctx.roundRect(-9, -9, 18, 46, 9); ctx.fill();
        ctx.fillStyle = '#f1c27d';
        ctx.beginPath(); ctx.arc(0, 41, 9, 0, Math.PI*2); ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.translate(28, -56);
        ctx.rotate(-armRaise*0.9 - (walking ? Math.sin(animFrame*0.3)*0.3 : 0));
        ctx.fillStyle = '#2e86c1';
        ctx.beginPath(); ctx.roundRect(-9, -9, 18, 46, 9); ctx.fill();
        ctx.fillStyle = '#f1c27d';
        ctx.beginPath(); ctx.arc(0, 41, 9, 0, Math.PI*2); ctx.fill();
        ctx.restore();

        // Keranjang saat berjalan
        if (walking) {
            ctx.fillStyle = '#b87333';
            ctx.beginPath(); ctx.ellipse(-48, -8, 24, 14, 0.2, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 2; ctx.stroke();

                ctx.arc(-60 + i*7, -19 + Math.sin(animFrame*0.1+i)*3, 5, 0, Math.PI*2);

                ctx.fill();
            }

        ctx.restore();

    function drawParabola(progress) {
        const originX = 180;
        const originY = H - 130;
        const xScale = 48;
        const yScale = 0.55;

        // Grid
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.lineWidth = 1;
        for (let i=-1; i<=12; i++) {
            const gx = originX + i*xScale;
            ctx.beginPath(); ctx.moveTo(gx, originY-380); ctx.lineTo(gx, originY+35); ctx.stroke();
        }
        for (let i=0; i<=6; i++) {
            const gy = originY - i*60;
            ctx.beginPath(); ctx.moveTo(originX-35, gy); ctx.lineTo(originX+640, gy); ctx.stroke();
        }

        // Sumbu
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(originX, originY-380); ctx.lineTo(originX, originY+30); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(originX-28, originY); ctx.lineTo(originX+660, originY); ctx.stroke();

        // Label
        ctx.fillStyle = '#fff'; ctx.font = 'bold 14px "Segoe UI"';
        ctx.fillText('x (kenaikan harga)', originX + 500, originY - 10);
        ctx.save();
        ctx.translate(originX-70, originY-180);
        ctx.rotate(-Math.PI/2);
        ctx.fillText('K(x) keuntungan', 0, 0);
        ctx.restore();

        // Kurva parabola
        ctx.beginPath();
        ctx.strokeStyle = '#ffb347';
        ctx.lineWidth = 5;
        ctx.shadowColor = '#ffb347';
        ctx.shadowBlur = 18;
        ctx.lineJoin = 'round';

        const maxX = 10;
        const prog = Math.min(progress, 1);
        let started = false;
        for (let xVal=0; xVal<=maxX*prog; xVal+=0.08) {
            const K = -10*xVal*xVal + 100*xVal;
            const px = originX + xVal*xScale;
            const py = originY - K*yScale;
            if (!started) { ctx.moveTo(px, py); started = true; }
            else ctx.lineTo(px, py);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Titik bergerak
        if (prog > 0.08) {
            const movingX = Math.min(maxX*prog, 8);
            const K = -10*movingX*movingX + 100*movingX;
            const px = originX + movingX*xScale;
            const py = originY - K*yScale;
            ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI*2);
            ctx.fillStyle = '#ffdd44'; ctx.shadowBlur = 20; ctx.shadowColor = '#ffaa00'; ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff'; ctx.font = 'bold 12px "Segoe UI"';
            ctx.fillText(`(${movingX.toFixed(1)}, ${K.toFixed(0)})`, px+12, py-8);
        }

        // Titik puncak
        if (prog > 0.55) {
            const peakX = originX + 5*xScale;
            const peakY = originY - 250*yScale;
            const pulse = Math.sin(animFrame*0.1)*3 + 11;
            ctx.beginPath(); ctx.arc(peakX, peakY, pulse, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(255,200,0,0.3)'; ctx.fill();
            ctx.beginPath(); ctx.arc(peakX, peakY, 8, 0, Math.PI*2);
            ctx.fillStyle = '#ffdd44'; ctx.shadowBlur = 25; ctx.shadowColor = '#ffaa00'; ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff'; ctx.font = 'bold 15px "Segoe UI"';
            ctx.fillText('MAKSIMUM', peakX+16, peakY-10);
            ctx.fillText('(5, 250)', peakX+16, peakY+8);
        }

        // Angka
        ctx.fillStyle = '#fff'; ctx.font = '12px "Segoe UI"';
        for (let i=0; i<=10; i+=2) ctx.fillText(i, originX + i*xScale - 4, originY+20);
        for (let i=0; i<=250; i+=50) ctx.fillText(i, originX-32, originY - i*yScale + 5);
    }

    function drawApplicationCards() {
        const cards = [
            { x: 120, y: 190, w: 240, h: 130, title: '💼 Ekonomi', desc: 'Keuntungan\nmaksimum' },
            { x: 400, y: 190, w: 240, h: 130, title: '📐 Geometri', desc: 'Luas\nmaksimum' },
            { x: 680, y: 190, w: 240, h: 130, title: '⚽ Fisika', desc: 'Tinggi\nmaksimum' },
            { x: 960, y: 190, w: 240, h: 130, title: '🏭 Produksi', desc: 'Biaya\nminimum' }
        ];
        cards.forEach((c, i) => {
            const float = Math.sin(animFrame*0.05 + i)*5;
            ctx.save();
            ctx.shadowColor = 'rgba(255,179,71,0.6)';
            ctx.shadowBlur = 20;
            ctx.fillStyle = 'rgba(20,39,62,0.92)';
            ctx.beginPath(); ctx.roundRect(c.x, c.y + float, c.w, c.h, 18); ctx.fill();
            ctx.strokeStyle = '#ffb347'; ctx.lineWidth = 2; ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffb347'; ctx.font = 'bold 17px "Segoe UI"';
            ctx.fillText(c.title, c.x+18, c.y + float + 32);
            ctx.fillStyle = '#cfe3ff'; ctx.font = '14px "Segoe UI"';
            c.desc.split('\n').forEach((line, li) => {
                ctx.fillText(line, c.x+18, c.y + float + 62 + li*22);
            });
            ctx.restore();
        });
    }

    function updateCoins(showCoins) {
        if (showCoins) {
            coinTimer++;
            if (coinTimer > 14) {
                coinTimer = 0;
                coins.push({
                    x: 500 + Math.random()*250, y: 380,
                    vy: -3 - Math.random()*3,
                    vx: (Math.random()-0.5)*3,
                    life: 60, size: 9 + Math.random()*7,
                    rotation: Math.random()*Math.PI
                });
                if (voiceEnabled && Math.random() > 0.7) playCoin();
            }
        }
        coins.forEach((c, i) => {
            c.x += c.vx; c.y += c.vy; c.vy += 0.15; c.life--; c.rotation += 0.1;
            if (c.life <= 0) coins.splice(i, 1);
        });
    }

    function drawCoins() {
        coins.forEach(c => {
            ctx.save();
            ctx.translate(c.x, c.y);
            ctx.rotate(c.rotation);
            ctx.beginPath(); ctx.ellipse(0, 0, c.size, c.size*0.6, 0, 0, Math.PI*2);
            ctx.fillStyle = '#f1c40f'; ctx.shadowBlur = 15; ctx.shadowColor = '#f1c40f'; ctx.fill();
            ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 2; ctx.stroke();
            ctx.restore();
        });
    }

    // ============ RENDER BERDASARKAN SEGMEN ============
    function renderSegment(segIndex) {
        const seg = segments[segIndex];
        ctx.clearRect(0, 0, W, H);

        // Background selalu
        drawBackground();

        // Tentukan "tahap cerita" berdasarkan index segmen
        // 0-1: pagi harapan
        // 2-3: hitung modal
        // 4-6: masalah harga
        // 7-10: model matematika
        // 11: respon Budi
        // 12-14: parabola & titik maksimum
        // 15: perhitungan K(5)
        // 16: respon Budi
        // 17-19: pasar ramai
        // 20-21: penerapan
        // 22-23: challenge
        // 24-25: penutup

        let budiTargetX = 340;
        let budiWalking = false;
        let budiArmRaise = 0.2;
        let showParabola = false;
        let showApp = false;
        let showCoins = false;
        let showCalculator = false;
        let showQuestionMark = false;

        if (segIndex <= 1) {
            budiTargetX = 340; budiWalking = true; budiArmRaise = 0.3;
        } else if (segIndex <= 3) {
            budiTargetX = 420; budiArmRaise = 0.7; showCalculator = true;
        } else if (segIndex <= 6) {
            budiTargetX = 380; budiArmRaise = 0.9; showQuestionMark = segIndex === 4;
        } else if (segIndex <= 10) {
            budiTargetX = 420; budiArmRaise = 0.2;
        } else if (segIndex === 11) {
            budiTargetX = 420; budiArmRaise = 0.6;
        } else if (segIndex <= 14) {
            showParabola = true; budiTargetX = 940; budiArmRaise = 0.1;
        } else if (segIndex === 15) {
            showParabola = true; showCoins = true; budiTargetX = 940;
        } else if (segIndex === 16) {
            showParabola = true; showCoins = true; budiTargetX = 940; budiArmRaise = 0.5;
        } else if (segIndex <= 19) {
            budiTargetX = 380; budiArmRaise = 0.5; showCoins = true;
        } else if (segIndex <= 21) {
            showApp = true; budiTargetX = 340; budiArmRaise = 0.3;
        } else if (segIndex <= 23) {
            showParabola = true; budiTargetX = 1020; budiArmRaise = 0.6;
        } else {
            budiTargetX = 560; budiWalking = true; budiArmRaise = 0.2;
        }

        // Update posisi Budi menuju target (smooth)
        budi.targetX = budiTargetX;
        const dx = budi.targetX - budi.x;
        if (Math.abs(dx) > 2) {
            budi.x += Math.sign(dx) * 2.2;
            budi.walking = true;
        } else {
            budi.walking = budiWalking;
            budi.x = budi.targetX;
        }

        // Update progress parabola
        if (showParabola) {
            parabolaProgress = Math.min(parabolaProgress + 0.012, 1);
        } else {
            parabolaProgress = 0;
        }

        // Gambar elemen
        if (showApp) {
            drawApplicationCards();
        }

        if (showParabola) {
            drawParabola(parabolaProgress);
        }

        // Gambar Budi
        const talkPhase = budi.talkTimer > 0 ? animFrame * 0.3 : 0;
        drawPakBudi(budi.x, budi.y, budi.scale, budi.walking, budiArmRaise, talkPhase);

        // Gambar pembeli (aktif di scene pasar)
        buyers.forEach(b => {
            if (segIndex <= 6 || (segIndex >= 17 && segIndex <= 19) || segIndex >= 24) {
                b.x += b.speed;
                if (b.x < -100) b.x = W + 100;
                if (b.x > W + 100) b.x = -100;
            }
            drawBuyer(b);
        });

        // Kalkulator (scene modal)
        if (showCalculator) {
            ctx.fillStyle = '#2c3e50';
            ctx.beginPath(); ctx.roundRect(720, 400, 85, 115, 10); ctx.fill();
            ctx.fillStyle = '#1abc9c'; ctx.fillRect(730, 410, 65, 32);
            ctx.fillStyle = '#fff'; ctx.font = 'bold 15px monospace';
            ctx.fillText('10000', 735, 432);
            for (let r=0; r<3; r++) for (let c=0; c<3; c++) {
                ctx.fillStyle = '#7f8c8d';
                ctx.beginPath(); ctx.arc(745 + c*17, 460 + r*17, 6, 0, Math.PI*2); ctx.fill();
            }
            // Uang
            for (let i=0; i<3; i++) {
                ctx.fillStyle = '#2ecc71';
                ctx.beginPath(); ctx.roundRect(580 + i*15, 470 + i*8, 70, 32, 3); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.font = '10px monospace';
                ctx.fillText('Rp10.000', 590 + i*15, 491 + i*8);
            }
        }

        // Tanda tanya
        if (showQuestionMark) {
            ctx.fillStyle = '#f1c40f';
            ctx.font = 'bold 55px "Segoe UI"';
            ctx.fillText('?', 800, 390 + Math.sin(animFrame*0.1)*10);
        }

        // Koin
        updateCoins(showCoins);
        drawCoins();

        // Teks besar khusus
        if (segIndex === 16 || segIndex === 17) {
            ctx.fillStyle = '#f1c40f';
            ctx.font = 'bold 32px "Segoe UI"';
            ctx.fillText('💰 Rp250.000 💰', 440, 340 + Math.sin(animFrame*0.08)*8);
        }

        if (segIndex >= 22 && segIndex <= 23) {
            ctx.fillStyle = '#ffb347';
            ctx.font = 'bold 44px "Segoe UI"';
            ctx.fillText('?', 940, 340 + Math.sin(animFrame*0.12)*12);
            ctx.fillText('?', 1040, 380 + Math.sin(animFrame*0.12 + 1)*12);
        }

        // Bintang penutup
        if (segIndex >= 24) {
            for (let i=0; i<18; i++) {
                const sx = 100 + (i*83 + animFrame*0.3) % 1080;
                const sy = 120 + Math.sin(animFrame*0.05 + i)*90;
                ctx.fillStyle = `rgba(255,220,100,${0.5 + Math.sin(animFrame*0.1+i)*0.5})`;
                ctx.beginPath(); ctx.arc(sx, sy, 3, 0, Math.PI*2); ctx.fill();
            }
        }
    }

    // ============ UPDATE UI ============
    function updateUI() {
        const seg = segments[currentSegmentIndex];
        chapterLabel.textContent = seg.chapter;
        speakerName.textContent = seg.speaker;
        dialogText.textContent = seg.text;

        if (seg.speaker === 'NARATOR') {
            speakerBadge.textContent = '🎙️ NARATOR';
            speakerBadge.style.background = '#3a6ea5';
        } else {
            speakerBadge.textContent = '👨‍🌾 PAK BUDI';
            speakerBadge.style.background = '#8b5a2b';
        }

        // Math panel
        if (seg.math) {
            mathPanel.innerHTML = seg.math.replace(/\n/g, '<br>');
            mathPanel.classList.add('show');
        } else {
            mathPanel.classList.remove('show');
        }

        // Progress
        const segStart = segments.slice(0, currentSegmentIndex).reduce((s, x) => s + x.duration, 0);
        const totalProgress = segStart + segmentElapsed;
        progressFill.style.width = (totalProgress / totalDuration * 100) + '%';

        // Time display
        const fmt = (t) => {
            const m = Math.floor(t/60);
            const s = Math.floor(t%60);
            return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        };
        timeDisplay.textContent = `${fmt(totalProgress)} / ${fmt(totalDuration)}`;
    }

    // ============ DIALOG / SUARA ============
    let lastSpokenIndex = -1;
    function triggerSpeech() {
        if (lastSpokenIndex === currentSegmentIndex) return;
        lastSpokenIndex = currentSegmentIndex;
        const seg = segments[currentSegmentIndex];
        budi.talkTimer = 150;
        if (voiceEnabled) {
            speak(seg.text, seg.speaker);
            playAmbience();
        }
    }

    // ============ GAME LOOP ============
    function loop(ts) {
        if (!lastTimestamp) lastTimestamp = ts;
        const dt = Math.min((ts - lastTimestamp) / 1000, 0.1);
        lastTimestamp = ts;

        if (isPlaying) {
            segmentElapsed += dt;
            totalElapsed += dt;

            // Trigger dialog saat segmen baru
            if (segmentElapsed >= 0.15 && lastSpokenIndex !== currentSegmentIndex) {
                triggerSpeech();
            }

            // Pindah segmen jika durasi habis
            if (segmentElapsed >= segments[currentSegmentIndex].duration) {
                if (currentSegmentIndex < segments.length - 1) {
                    currentSegmentIndex++;
                    segmentElapsed = 0;
                    parabolaProgress = 0;
                    coins = [];
                    triggerSpeech();
                } else {
                    // Film selesai
                    isPlaying = false;
                    playPauseBtn.textContent = '▶';
                }
            }
        }

        // Selalu render & update
        renderSegment(currentSegmentIndex);
        updateUI();

        // Kurangi talkTimer
        if (budi.talkTimer > 0) budi.talkTimer -= 1;

        animFrame++;
        requestAnimationFrame(loop);
    }

    // ============ KONTROL ============
    playPauseBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        playPauseBtn.textContent = isPlaying ? '⏸' : '▶';
        if (isPlaying) {
            lastTimestamp = 0;
            // Jika sudah di akhir, mulai ulang
            if (currentSegmentIndex >= segments.length - 1 && segmentElapsed >= segments[currentSegmentIndex].duration) {
                currentSegmentIndex = 0;
                segmentElapsed = 0;
                lastSpokenIndex = -1;
            }
            triggerSpeech();
        } else {
            window.speechSynthesis.cancel();
            dialogBox.classList.remove('talking');
        }
    });

    restartBtn.addEventListener('click', () => {
        currentSegmentIndex = 0;
        segmentElapsed = 0;
        totalElapsed = 0;
        parabolaProgress = 0;
        coins = [];
        lastSpokenIndex = -1;
        isPlaying = true;
        playPauseBtn.textContent = '⏸';
        lastTimestamp = 0;
        window.speechSynthesis.cancel();
        dialogBox.classList.remove('talking');
        initBuyers();
        budi.x = -200;
        triggerSpeech();
    });

    progressTrack.addEventListener('click', (e) => {
        const rect = progressTrack.getBoundingClientRect();
        const ratio = (e.clientX - rect.left) / rect.width;
        const targetTime = ratio * totalDuration;

        // Cari segmen yang tepat
        let acc = 0;
        for (let i=0; i<segments.length; i++) {
            if (acc + segments[i].duration >= targetTime) {
                currentSegmentIndex = i;
                segmentElapsed = targetTime - acc;
                break;
            }
            acc += segments[i].duration;
        }
        parabolaProgress = 0;
        coins = [];
        lastSpokenIndex = -1;
        window.speechSynthesis.cancel();
        dialogBox.classList.remove('talking');
        lastTimestamp = 0;
        triggerSpeech();
    });

    // ============ INIT ============
    initBuyers();
    isPlaying = true;
    playPauseBtn.textContent = '⏸';
    requestAnimationFrame(loop);

    // Klik pertama untuk mengaktifkan audio
    document.addEventListener('click', function initAudio() {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        document.removeEventListener('click', initAudio);
    }, { once: false });
})();
</script>
</body>
</html>
